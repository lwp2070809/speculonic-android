build:
  maxIssues: 0
  excludeCorrectable: false

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeImportStatements: true
    excludeCommentStatements: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '100'
      - '500'
      - '1000'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
  ReturnCount:
    active: true
    max: 8
    excludedFunctions:
      - 'equals'
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 2
    excludeGuardClauses: true
  NewLineAtEndOfFile:
    active: true
  WildcardImport:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateProperty:
    active: true
  UseCheckOrError:
    active: true
  LoopWithTooManyJumpStatements:
    active: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'Composable'
      - 'GET'
      - 'POST'
      - 'Inject'
      - 'AssistedInject'
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated:
      - 'Composable'
  NestedBlockDepth:
    active: true
    threshold: 4
  ComplexCondition:
    active: true
    threshold: 4
  LargeClass:
    active: true
    threshold: 600
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 25
    thresholdInObjects: 15
    thresholdInEnums: 11
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
    excludes:
      - '**/data/db/dao/**'
      - '**/network/api/**'

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
  VariableNaming:
    active: true
  MatchingDeclarationName:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionThrown:
    active: true
  TooGenericExceptionCaught:
    active: false
  InstanceOfCheckForException:
    active: false
