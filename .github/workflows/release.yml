name: Android Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_REPO: ${{ github.repository }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - env:
          URL_KAGUYA_1: ${{ secrets.EASTER_EGG_URL_KAGUYA_1 }}
          URL_KAGUYA_2: ${{ secrets.EASTER_EGG_URL_KAGUYA_2 }}
          URL_YACHIYO_1: ${{ secrets.EASTER_EGG_URL_YACHIYO_1 }}
          URL_YACHIYO_2: ${{ secrets.EASTER_EGG_URL_YACHIYO_2 }}
        run: |
          echo "easterEggUrl.kaguya_1=${URL_KAGUYA_1}" >> local.properties
          echo "easterEggUrl.kaguya_2=${URL_KAGUYA_2}" >> local.properties
          echo "easterEggUrl.yachiyo_1=${URL_YACHIYO_1}" >> local.properties
          echo "easterEggUrl.yachiyo_2=${URL_YACHIYO_2}" >> local.properties

      - env:
          LOCAL_GRADLE_KTS_CONTENT: ${{ vars.LOCAL_GRADLE_KTS }}
        run: |
          if [ -n "$LOCAL_GRADLE_KTS_CONTENT" ]; then
            printf "%s\n" "$LOCAL_GRADLE_KTS_CONTENT" > local.gradle.kts
            echo "=========================================================="
            echo "   AUDIT LOG: local.gradle.kts"
            echo "=========================================================="
            cat local.gradle.kts
            echo "=========================================================="
          else
            echo "// Stub" > local.gradle.kts
          fi

      - run: chmod +x gradlew

      - run: ./gradlew detekt

      - run: ./gradlew assembleRelease

      - name: Get build-tools version
        run: |
          BUILD_TOOL_VERSION=$(ls $ANDROID_HOME/build-tools/ | tail -n 1)
          echo "Detected build-tools version: $BUILD_TOOL_VERSION"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign APK
        env:
          SIGNING_KEY_VAL: ${{ secrets.SIGNING_KEY }}
        run: |
          BUILD_TOOL_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          mkdir -p app/build/outputs/apk/release/
          
          if [ -n "$SIGNING_KEY_VAL" ]; then
            echo "$SIGNING_KEY_VAL" | base64 -d > release.keystore
            
            # Sign github variant
            $BUILD_TOOL_PATH/zipalign -v 4 app/build/outputs/apk/github/release/app-github-release-unsigned.apk app/build/outputs/apk/github/release/github-aligned.apk
            $BUILD_TOOL_PATH/apksigner sign --ks release.keystore --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out app/build/outputs/apk/release/speculonic-github-release.apk app/build/outputs/apk/github/release/github-aligned.apk
            
            # Sign fdroid variant
            $BUILD_TOOL_PATH/zipalign -v 4 app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk app/build/outputs/apk/fdroid/release/fdroid-aligned.apk
            $BUILD_TOOL_PATH/apksigner sign --ks release.keystore --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out app/build/outputs/apk/release/speculonic-fdroid-release.apk app/build/outputs/apk/fdroid/release/fdroid-aligned.apk
            
            rm -f release.keystore
            rm -f app/build/outputs/apk/github/release/github-aligned.apk
            rm -f app/build/outputs/apk/fdroid/release/fdroid-aligned.apk
            rm -f app/build/outputs/apk/github/release/app-github-release-unsigned.apk
            rm -f app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
            
            echo "Release APKs are signed and ready."
          else
            echo "Signing key is empty. Copying unsigned APKs."
            cp app/build/outputs/apk/github/release/app-github-release-unsigned.apk app/build/outputs/apk/release/speculonic-github-release-unsigned.apk
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk app/build/outputs/apk/release/speculonic-fdroid-release-unsigned.apk
          fi

      - name: Prepare APK outputs
        run: |
          ls -lh app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/speculonic-*.apk

      - name: Extract Tag Message
        run: |
          # Force fetch the specific tag to ensure we have the annotated tag object, not just a lightweight tag created by checkout
          git fetch origin refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }} --force
          
          # Extract the tag message and strip the PGP signature if present
          TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }} | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git log -1 --pretty=%B)
          fi
          
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$TAG_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speculonic ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: app/build/outputs/apk/release/speculonic-*.apk
